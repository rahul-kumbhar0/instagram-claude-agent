services:
  - type: web
    name: flowcast-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MCP_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7
